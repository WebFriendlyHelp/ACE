name: Bug report
description: Report a problem with ACE, including screen reader, keyboard, export, or update problems
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem in ACE.

        Please do not paste message text, contact names, phone numbers, or attachments from your backup into this form. Issues are public. Describe what happened instead, for example "a conversation with about 2,000 messages from 2019".

        For a security problem, do not use this form. Email help@webfriendlyhelp.com instead, as described in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What part of ACE is affected?
      options:
        - Opening or reading a backup
        - Conversation list or transcript
        - Screen reader support
        - Keyboard navigation
        - Calls or voicemail
        - Playing voice messages
        - Exporting
        - Installing or updating
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ACE version
      description: The version is shown on the About item in the Help menu.
      placeholder: "Example: 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Installer or portable
      options:
        - Installer
        - Portable
        - Not sure
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: assistive-tech
    attributes:
      label: Assistive technology
      description: Which screen reader or other assistive technology were you using?
      options:
        - NVDA
        - JAWS
        - Narrator
        - Other screen reader
        - Magnification only
        - None
    validations:
      required: false
  - type: dropdown
    id: backup
    attributes:
      label: Backup type
      options:
        - Encrypted
        - Not encrypted
        - Not sure
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ACE
        2. Choose the backup
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen or to hear?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened or what was spoken instead?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The exact wording of any error ACE showed. Remove anything from your messages first.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I left out message content and personal details from my backup.
          required: true
